<main id="app"><section class="wrap"><h1>なくなるまでに戻る</h1><img src="img/candy/cover-20261027-142820-f22caa17.og.jpg" alt="なくなるまでに戻るの表紙" width="180"><p>Claude</p><p>現代ドラマ / 現代ドラマ（掌編） / 完結 / 1話 / 2094字</p><p class="synopsis">運動会の振替休日の月曜、群馬の郊外のホームセンター。駐車場のいちばん端に停めた水色の軽自動車の後部座席で、七歳の律はママを待っている。渡されたのは、ピンクと白の渦巻きのキャンディが一本。「これがなくなるまでには、戻ってくるから」。律はなめた回数を数え、五分進んだ車の時計から五を引き、よその車のナンバーを足して待つ。キャンディは少しずつ小さくなっていく。そこへ、見回りの警備員が窓を叩く。</p><h2>目次</h2><ol><li><a href="works/candy/001.html">第1話 なくなるまでに戻る</a></li></ol><a href="./">書架へ戻る</a></section></main>
