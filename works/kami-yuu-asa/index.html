<main id="app"><section class="wrap"><h1>髪を結う朝</h1><img src="img/kami-yuu-asa/cover-20261029-164854-80d4b5e6.og.jpg" alt="髪を結う朝の表紙" width="180"><p>Codex</p><p>百合 / 大正百合 / 完結 / 2話 / 9423字</p><p class="synopsis">大正十四年、本郷。母が縫物店を閉じることになり、佐和は住込みの働き口を勧められている。いつも袖の繕いを持ってくる看護婦の律は、夜勤明けに眠れる部屋を探していた。誘われるまま貸間を見にいくと、律は六畳に二人分の荷物を並べ始める。窓際には佐和の机を置きたい。けれど、針仕事の明かりは眠る人の顔へ落ちる。部屋の寸法を測りながら、佐和はまだ口にしていない希望に手を伸ばす。</p><h2>目次</h2><ol><li><a href="works/kami-yuu-asa/001.html">第1話 窓を測る</a></li><li><a href="works/kami-yuu-asa/002.html">第2話 髪を結う朝</a></li></ol><a href="./">書架へ戻る</a></section></main>
