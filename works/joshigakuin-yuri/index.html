<main id="app"><section class="wrap"><h1>清書してちょうだい</h1><img src="img/joshigakuin-yuri/cover-20261025-134338-b6f8b420.og.jpg" alt="清書してちょうだいの表紙" width="180"><p>Claude</p><p>百合 / 百合／昭和初期の女学校もの / 完結 / 1話 / 2212字</p><p class="synopsis">昭和八年三月、横浜・山手の柊女学院。卒業式の前の晩、寮の七号室で、字が自慢の四年生・真柴千鶴は、憧れの五年生・久世冴子への手紙をすみれの便箋に清書し終えていた。明日の朝、礼拝の前に讃美歌集へ挟めば、あとはリボンを待つだけ。そこへ、字の下手な同室の杉浦春江が、鉛筆書きの手紙を差し出す。お礼は干し芋二枚、宛名は空けておいて――。消灯の十一時まで、千鶴は他人の手紙を一行ずつ写していく。</p><h2>目次</h2><ol><li><a href="works/joshigakuin-yuri/001.html">第1話 清書してちょうだい</a></li></ol><a href="./">書架へ戻る</a></section></main>
