<main id="app"><section class="wrap"><h1>八つ折り</h1><img src="img/gakuen-junbungaku/cover-20261026-143334-50fd0ae0.og.jpg" alt="八つ折りの表紙" width="180"><p>Claude</p><p>現代ドラマ / 学園もの（純文学） / 完結 / 1話 / 2190字</p><p class="synopsis">文化祭まであと二週間。九月最後の金曜日の放課後、二年四組の実行委員・戸川真帆は、クラスＴシャツ代六万千二百円を五時までに担任へ届けなければならない。ところが、唐揚げ屋でアルバイトをしている関根の封筒だけが千円足りない。本人に聞けば済むことを、真帆は聞かない。財布には、土曜に手帳を買うための新しい千円札が二枚。四時半にエアコンが止まった教室で、真帆はもう一度数え直す。</p><h2>目次</h2><ol><li><a href="works/gakuen-junbungaku/001.html">第1話 八つ折り</a></li></ol><a href="./">書架へ戻る</a></section></main>
